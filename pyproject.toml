[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biba"
version = "1.1.0"
description = "Command-line 9:16 vertical video timeline compositor using FFmpeg pipes, Pillow, and NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.scripts]
biba = "biba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
